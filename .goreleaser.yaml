archives:
  - id: default
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "csdfparallel_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    ids:
      - csdfparallel
      - csdfpromote
      - csdfhide
      - csdfcomp
      - csdfparse
      - csdfevents
      - csdfrepl
      - csdfnorm
      - csdfsort
      - csdflivelockfree
      - csdfrefinement
      - csdfrepld
      - csdfreplcmd
      - obligationirc
      - csdfhelp
    files:
      - README.md
      - LICENSE*
      - docs/**/*
      - examples/**/*

checksum:
  name_template: "checksums.txt"

release:
  prerelease: auto

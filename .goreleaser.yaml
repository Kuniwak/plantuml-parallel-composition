version: 2

builds:
  - id: csdfparallel
    main: ./tools/csdfparallel/main.go
    binary: csdfparallel
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/Kuniwak/puml-parallel/version.Version={{ .Version }}

